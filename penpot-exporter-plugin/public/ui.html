<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Penpot Unity UI Exporter</title></head>
<body>
  <p id="status">Preparing export...</p>
  <button id="download" disabled>Download JSON and PNG assets</button>
  <script>
    let payload;
    const status = document.getElementById("status");
    const button = document.getElementById("download");
    const download = (blob, name) => { const url = URL.createObjectURL(blob); const anchor = document.createElement("a"); anchor.href = url; anchor.download = name; anchor.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); };
    async function rasterize(asset) {
      const url = URL.createObjectURL(new Blob([asset.svgMarkup], { type: "image/svg+xml" }));
      try {
        const image = new Image();
        await new Promise((resolve, reject) => { image.onload = resolve; image.onerror = reject; image.src = url; });
        const canvas = document.createElement("canvas"); canvas.width = Math.max(1, Math.round(asset.width)); canvas.height = Math.max(1, Math.round(asset.height));
        canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
        return await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
      } finally { URL.revokeObjectURL(url); }
    }
    window.addEventListener("message", (event) => {
      if (event.data?.type !== "penpot-unity-ui-export") return;
      payload = event.data.payload;
      status.textContent = `${payload.assets?.length ?? 0} complex layer asset(s) will be exported.`;
      button.disabled = false;
    });
    button.addEventListener("click", async () => {
      button.disabled = true;
      for (let index = 0; index < (payload.assetExports ?? []).length; index += 1) {
        const asset = payload.assetExports[index]; status.textContent = `Exporting asset ${index + 1} of ${payload.assetExports.length}...`;
        const png = await rasterize(asset); if (png) download(png, asset.fileName);
      }
      const json = { ...payload }; delete json.assetExports;
      download(new Blob([JSON.stringify(json, null, 2)], { type: "application/json" }), "penpot-unity-ui.json");
      status.textContent = "Export complete. Copy PNG files with unity_ui_copy_penpot_asset.";
    });
  </script>
</body>
</html>
